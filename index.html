<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XEG5R5YZ7V"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-XEG5R5YZ7V', { send_page_view: false });
(function () {
  var last = null;
  function track() {
    setTimeout(function () {
      var view = location.hash.replace('#', '') || 'home';
      if (view === last) return; last = view;
      gtag('event', 'page_view', {
        page_title: document.title + ' [' + view + ']',
        page_location: location.origin + location.pathname + (location.hash || '#home'),
        page_path: '/' + view
      });
    }, 50);
  }
  window.addEventListener('hashchange', track);
  window.addEventListener('load', track);
})();
</script>
<title>Gradient Atlas</title>
<meta name="description" content="Classical machine learning as a map you can explore, a route you can plan, a console you can type into, and cards you can recall.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script>try { const t = JSON.parse(localStorage.getItem('s2s2.theme')); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/metro.css">
<link rel="stylesheet" href="css/console.css">
<link rel="stylesheet" href="css/recall.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/tour.css">
<link rel="stylesheet" href="css/home.css">
<script src="js/mathjax-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#home" aria-label="Gradient Atlas, ML Materials — home"><span class="glyph"></span><span class="bt"><b>Gradient Atlas</b><small>ML Materials</small></span></a>
  <form class="repl" id="repl" autocomplete="off">
    <div class="repl-in"><span class="ps">&gt;&gt;&gt;</span><input id="cmd" type="text" spellcheck="false" aria-label="Command prompt" placeholder="open(11) · search('lasso') · path_to('boosting') · help()"><button class="run" type="submit">Run ↵</button></div>
    <div class="suggest" id="suggest" hidden></div>
  </form>
  <button class="icon-btn" id="tourBtn" type="button" aria-label="Take the guided tour" title="Take the tour" style="font-family:var(--f-mono);font-weight:600">?</button>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
</div></header>

<nav class="rail" aria-label="Views">
  <a href="#home" data-v="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>Home</a>
  <a href="#map" data-v="map"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="3.5" r="1.6"/><circle cx="19" cy="15" r="1.6"/><circle cx="6" cy="17" r="1.6"/><path d="M12 5.1 18 14M7.4 16.2 17.4 15"/></svg>Map</a>
  <a href="#route" data-v="metro"><svg viewBox="0 0 24 24"><path d="M3 6h7l4 6h7M3 18h5l4-6"/><circle cx="3" cy="6" r="1.5"/><circle cx="21" cy="12" r="1.5"/><circle cx="12" cy="12" r="2.2"/><circle cx="3" cy="18" r="1.5"/></svg>Route</a>
  <a href="#console" data-v="console"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m7 9 3 3-3 3M12.5 15H17"/></svg>Console</a>
  <a href="#recall" data-v="recall"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="13" height="15" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/><path d="m7.5 14 2 2 4-4.5"/></svg>Recall<span class="due" id="dueBadge" hidden></span></a>
  <span class="sep"></span>
  <a href="#ch1" data-v="read" id="readLink"><svg viewBox="0 0 24 24"><path d="M3 5.5C6 4 9 4 12 6c3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z"/><path d="M12 6v13.5"/></svg>Read</a>
</nav>

<!-- each view's markup lives in views/*.html; js/main.js loads them into this element -->
<main class="stage"></main>
<div class="toast" id="toast" hidden></div>
</body>
</html>
